[project]
name = "intakeflow"
version = "0.1.0"
description = "Human-reviewed maintenance intake"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2", "uvicorn[standard]==0.54.0", "pydantic==2.14.1",
  "pydantic-settings==2.16.0", "sqlalchemy==2.0.54", "psycopg[binary,pool]==3.3.6",
  "alembic==1.20.0", "argon2-cffi==25.1.0", "celery[redis]==5.6.3",
  "langchain-openai==1.7.2", "langgraph==1.2.15", "langgraph-checkpoint-postgres==3.2.0",
  "email-validator==2.3.0", "tzdata==2026.5"
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL", "live: explicitly enabled paid provider smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
